
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner QR de asistencia</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
    }

    h2 { color: #1a73e8; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
    }

    button:disabled { opacity: .5; }

    #estado {
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      background: #e8f0fe;
      overflow-wrap: anywhere;
    }

    #reader {
      width: 100%;
      margin-top: 14px;
    }
  </style>
</head>

<body>
<main>
  <h2>📷 Escáner QR</h2>
  <p>Coloca el código QR del socio frente a la cámara.</p>

  <div id="reader"></div>
  <div id="estado">Preparando cámara...</div>

  <button id="btnIniciar" disabled>Iniciar cámara</button>
  <button id="btnCerrar">Cerrar escáner</button>
</main>
  

<script>
  const estado = document.getElementById('estado');
  const btnIniciar = document.getElementById('btnIniciar');
  const btnCerrar = document.getElementById('btnCerrar');
  /*
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbzdf3DnzlO9rblR1UGnxdPgK6TnPxdoo1H6YwrZ855bD7Sh4Tgt6f4ZerfHj7ti_xMZTw/exec';
    */
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbwcOgCl_GuAhzwTodDDzIoQoZDNwbxCP0QJ-KYE-b4hNxm0XHeNFnHDnYLOX4yJB70lsA/exec';

  const ID_REUNION = new URLSearchParams(
    window.location.search
  ).get('reunion') || '';

  let scanner = null;
  let iniciando = false;
  let enviando = false;

  function mostrarEstado(texto) {
    estado.textContent = texto;
  }

  window.addEventListener('error', function(e) {
    mostrarEstado('Error JavaScript: ' + e.message);
    btnIniciar.disabled = false;
  });

  window.addEventListener('unhandledrejection', function(e) {
    mostrarEstado(
      'Error de inicialización: ' + String(e.reason)
    );
    btnIniciar.disabled = false;
  });

  async function iniciarEscaner() {
    if (iniciando || scanner) return;

    if (
      !window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      mostrarEstado(
        'No se puede acceder a la cámara. Abre esta página mediante HTTPS en Chrome.'
      );
      return;
    }

    iniciando = true;
    btnIniciar.disabled = true;

    mostrarEstado('Solicitando permiso para utilizar la cámara...');

    try {
      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 240, height: 240 }
        },
        codigoLeido,
        function() {}
      );

      mostrarEstado('Cámara activa. Escanea el QR del socio.');

    } catch (error) {
      scanner = null;
      btnIniciar.disabled = false;

      mostrarEstado(
        'No se pudo iniciar la cámara: ' +
        (error.message || String(error)) +
        '. Revisa los permisos de cámara.'
      );

    } finally {
      iniciando = false;
    }
  }

  async function detenerEscaner() {
    if (!scanner) return;

    const instancia = scanner;
    scanner = null;

    try {
      await instancia.stop();
    } catch (error) {
      // La cámara podría haberse detenido previamente.
    }

    try {
      instancia.clear();
    } catch (error) {}
  }

  async function codigoLeido(texto) {
    if (enviando) return;

    const codigo = String(texto || '').trim();
    if (!codigo) return;

    enviando = true;
    btnIniciar.disabled = true;

    mostrarEstado('QR leído. Registrando asistencia...');

    await detenerEscaner();

    if (!ID_REUNION) {
      mostrarEstado(
        'Falta el ID de la reunión. Abre el escáner desde la aplicación principal.'
      );
      enviando = false;
      btnIniciar.disabled = false;
      return;
    }

    solicitarRegistro(codigo);
  }

  function solicitarRegistro(codigo) {
    const callback = 'qrCallback_' +
      Date.now() + '_' +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');
    let finalizado = false;
    let temporizador;

    function limpiar() {
      if (finalizado) return;
      finalizado = true;

      clearTimeout(temporizador);
      delete window[callback];
      script.remove();
    }

    window[callback] = function(resultado) {
      limpiar();

      mostrarEstado(
        (resultado.mensaje || 'Respuesta recibida') +
        (resultado.nombre ? ' — ' + resultado.nombre : '')
      );

      enviando = false;
      btnIniciar.disabled = false;
    };

    script.onerror = function() {
      limpiar();

      mostrarEstado(
        'No se pudo comunicar con Apps Script. Revisa su implementación.'
      );

      enviando = false;
      btnIniciar.disabled = false;
    };

    const parametros = new URLSearchParams({
      accion: 'registrar',
      codigo: codigo,
      reunion: ID_REUNION,
      callback: callback
    });

    script.src = URL_APPS_SCRIPT + '?' + parametros.toString();
    document.body.appendChild(script);

    temporizador = setTimeout(function() {
      if (finalizado) return;

      limpiar();

      mostrarEstado(
        'Tiempo de espera agotado. Comprueba la conexión y Apps Script.'
      );

      enviando = false;
      btnIniciar.disabled = false;
    }, 20000);
  }

  btnIniciar.addEventListener('click', iniciarEscaner);

  btnCerrar.addEventListener('click', async function() {
    await detenerEscaner();
    window.close();

    mostrarEstado(
      'Escáner detenido. Si esta ventana no se cierra automáticamente, puedes cerrarla manualmente.'
    );
  });

  mostrarEstado('Pulsa «Iniciar cámara» para comenzar.');
  btnIniciar.disabled = false;
</script>
  
</body>
</html>
